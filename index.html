<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Elite National Hospital Management System</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
:root {
  --primary:#1e40af;
  --dark:#111827;
  --light:#f3f4f6;
  --success:#10b981;
  --danger:#ef4444;
}

*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:Segoe UI;background:var(--light);}

.hidden{display:none}

/* LOGIN */
#login-page{
  display:flex;justify-content:center;align-items:center;
  height:100vh;background:linear-gradient(135deg,#1e40af,#1e3a8a);
}
.login-box{
  background:white;padding:2rem;border-radius:10px;width:350px;
}
input,select,button{width:100%;padding:10px;margin-top:10px}
button{background:var(--primary);color:white;border:none}

/* APP */
#app{display:grid;grid-template-columns:250px 1fr;height:100vh}
#sidebar{background:var(--dark);color:white;padding:1rem}
#sidebar a{display:block;color:white;padding:10px;text-decoration:none}
#sidebar a:hover{background:#374151}

#main{padding:20px;overflow:auto}

.card{background:white;padding:20px;border-radius:10px;margin-bottom:20px}

table{width:100%;border-collapse:collapse}
th,td{padding:10px;border-bottom:1px solid #ddd}

.status-stable{color:green;font-weight:bold}
.status-critical{color:red;font-weight:bold}
.status-improving{color:blue;font-weight:bold}
.status-discharged{color:gray;font-weight:bold}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="login-page">
  <div class="login-box">
    <h2>Login</h2>
    <input id="username" placeholder="Username">
    <input id="password" type="password" placeholder="Password">
    <select id="role">
      <option value="">Select Role</option>
      <option value="admin">Admin</option>
      <option value="nurse">Nurse</option>
    </select>
    <button onclick="login()">Login</button>
    <p id="error" style="color:red"></p>
  </div>
</div>

<!-- APP -->
<div id="app" class="hidden">

  <div id="sidebar">
    <h3>ENHMS</h3>

    <a href="#" onclick="show('dashboard')">Dashboard</a>

    <div class="role-admin hidden">
      <a href="#" onclick="show('allPatients')">All Patients</a>
    </div>

    <div class="role-nurse hidden">
      <a href="#" onclick="show('patients')">My Patients</a>
    </div>

    <a href="#" onclick="logout()">Logout</a>
  </div>

  <div id="main">

    <!-- DASHBOARD -->
    <div id="dashboard" class="page">
      <div class="card">
        <h2>Welcome <span id="name"></span></h2>
        <p>Role: <span id="roleText"></span></p>
      </div>
    </div>

    <!-- NURSE -->
    <div id="patients" class="page hidden">
      <div class="card">
        <h2>My Patients</h2>
        <table>
          <thead>
            <tr>
              <th>Name</th><th>Age</th><th>Status</th><th>Room</th><th>Action</th>
            </tr>
          </thead>
          <tbody id="patientsBody"></tbody>
        </table>

        <h3>Reports</h3>
        <div id="reports"></div>
      </div>
    </div>

    <!-- ADMIN -->
    <div id="allPatients" class="page hidden">
      <div class="card">
        <h2>All Patients</h2>
        <table>
          <thead>
            <tr>
              <th>Name</th><th>Age</th><th>Status</th><th>Room</th>
            </tr>
          </thead>
          <tbody id="adminPatients"></tbody>
        </table>

        <h3>All Reports</h3>
        <div id="adminReports"></div>
      </div>
    </div>

  </div>
</div>

<script>
// USERS
const users={
  admin:{pass:'admin123',name:'Admin Mukasa'},
  nurse01:{pass:'nurse2025',name:'Nurse Sarah'}
};

// DATABASE INIT
if(!localStorage.getItem("patients")){
  localStorage.setItem("patients",JSON.stringify([
    {name:"John",age:30,status:"Stable",room:"Ward 1"},
    {name:"Amina",age:25,status:"Critical",room:"ICU"}
  ]));
}
if(!localStorage.getItem("reports")){
  localStorage.setItem("reports","[]");
}

// LOGIN
function login(){
  let u=username.value.trim().toLowerCase();
  let p=password.value;
  let r=role.value;

  if(
    (u==="admin" && p==="admin123" && r==="admin") ||
    (u==="nurse01" && p==="nurse2025" && r==="nurse")
  ){
    loginPage.style.display="none";
    app.classList.remove("hidden");

    name.textContent=users[u].name;
    roleText.textContent=r;

    document.querySelectorAll(".role-"+r).forEach(el=>el.classList.remove("hidden"));

    loadPatients();
    loadReports();
  }else{
    error.textContent="Wrong login";
  }
}

// LOGOUT
function logout(){location.reload();}

// NAV
function show(id){
  document.querySelectorAll(".page").forEach(p=>p.classList.add("hidden"));
  document.getElementById(id).classList.remove("hidden");
}

// LOAD PATIENTS
function loadPatients(){
  let data=JSON.parse(localStorage.getItem("patients"));

  patientsBody.innerHTML="";
  adminPatients.innerHTML="";

  data.forEach(p=>{
    // nurse table
    let row=`
      <tr>
        <td>${p.name}</td>
        <td>${p.age}</td>
        <td class="status-${p.status.toLowerCase()}">${p.status}</td>
        <td>${p.room}</td>
        <td>
          <button onclick="updateStatus('${p.name}')">Update</button>
          <button onclick="addReport('${p.name}')">Report</button>
        </td>
      </tr>`;
    patientsBody.innerHTML+=row;

    // admin table
    adminPatients.innerHTML+=`
      <tr>
        <td>${p.name}</td>
        <td>${p.age}</td>
        <td>${p.status}</td>
        <td>${p.room}</td>
      </tr>`;
  });
}

// UPDATE STATUS
function updateStatus(name){
  let data=JSON.parse(localStorage.getItem("patients"));
  let p=data.find(x=>x.name===name);

  let s=prompt("New status",p.status);
  if(s){
    p.status=s;
    localStorage.setItem("patients",JSON.stringify(data));
    loadPatients();
  }
}

// REPORT
function addReport(name){
  let txt=prompt("Enter report");
  if(!txt)return;

  let reports=JSON.parse(localStorage.getItem("reports"));
  reports.unshift({name,text:txt,time:new Date().toLocaleString()});
  localStorage.setItem("reports",JSON.stringify(reports));

  loadReports();
}

// LOAD REPORTS
function loadReports(){
  let reports=JSON.parse(localStorage.getItem("reports"));

  reportsDiv="";
  adminReportsDiv="";

  reports.forEach(r=>{
    let html=`<div class="card"><b>${r.name}</b><br>${r.text}<br><small>${r.time}</small></div>`;
    reportsDiv+=html;
    adminReportsDiv+=html;
  });

  document.getElementById("reports").innerHTML=reportsDiv;
  document.getElementById("adminReports").innerHTML=adminReportsDiv;
}
</script>

</body>
</html>
