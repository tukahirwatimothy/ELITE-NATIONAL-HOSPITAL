<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Elite National Hospital Management System - REALTIME</title>

<link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/main.min.css" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/main.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
:root{--primary:#1e40af;--dark:#111827;--light:#f3f4f6;--success:#10b981;--danger:#ef4444}
body{margin:0;font-family:Arial;background:var(--light)}
.hidden{display:none}
#login{display:flex;justify-content:center;align-items:center;height:100vh}
.box{background:white;padding:20px;border-radius:10px;width:320px}
button{padding:10px;width:100%;margin-top:10px}
#app{display:grid;grid-template-columns:240px 1fr}
#sidebar{background:var(--dark);color:white;height:100vh;padding:15px}
#main{padding:20px}
.card{background:white;padding:15px;margin-bottom:15px;border-radius:10px}
.dark{background:#111;color:white}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login">
<div class="box">
<h2>ENHMS Login</h2>
<input id="username" placeholder="username"><br>
<input id="password" type="password" placeholder="password"><br>
<select id="role">
<option value="admin">Admin</option>
<option value="nurse">Nurse</option>
</select>
<button onclick="login()">Login</button>
<p id="error"></p>
</div>
</div>

<!-- APP -->
<div id="app" class="hidden">
<div id="sidebar">
<h3>ENHMS</h3>
<button onclick="show('dashboard')">Dashboard</button>
<button onclick="show('patients')">Patients</button>
<button onclick="show('calendar')">Calendar</button>
<button onclick="toggleDark()">Dark Mode</button>
<button onclick="logout()">Logout</button>
</div>

<div id="main">

<div id="dashboard" class="page">
<div class="card">Active Patients: <span id="count"></span></div>
<canvas id="chart"></canvas>
</div>

<div id="patients" class="page hidden">
<div class="card">
<input id="pname" placeholder="Patient Name">
<input id="page" placeholder="Age">
<button onclick="addPatient()">Add Patient</button>
</div>
<table border="1" width="100%"><tbody id="ptable"></tbody></table>
</div>

<div id="calendar" class="page hidden">
<div id="cal"></div>
</div>

</div>
</div>

<script>

const users={
admin:{pass:'admin123',role:'admin'},
nurse01:{pass:'nurse2025',role:'nurse'}
};

let patients=JSON.parse(localStorage.getItem('patients'))||[];
let calendar, chart;

function save(){
localStorage.setItem('patients',JSON.stringify(patients));
updateAll();
}

function login(){
let u=username.value.trim();
let p=password.value;
let r=role.value;

if(users[u] && users[u].pass===p && users[u].role===r){
login.style.display='none';
app.classList.remove('hidden');
initCalendar();
updateAll();
}else error.innerText='Invalid login';
}

function logout(){location.reload();}

function show(id){
document.querySelectorAll('.page').forEach(p=>p.classList.add('hidden'));
document.getElementById(id).classList.remove('hidden');
if(id==='calendar') calendar.render();
}

function addPatient(){
let name=pname.value.trim();
let age=page.value;
if(!name||!age)return;

patients.push({
id:Date.now(),
name,age,
status:'Stable',
date:new Date().toISOString().split('T')[0]
});

save();
pname.value=''; page.value='';
}

function renderPatients(){
ptable.innerHTML='';
patients.forEach(p=>{
ptable.innerHTML+=`<tr>
<td>${p.name}</td>
<td>${p.age}</td>
<td>${p.status}</td>
</tr>`;
});
}

function updateChart(){
if(chart) chart.destroy();
chart=new Chart(document.getElementById('chart'),{
type:'bar',
data:{labels:['Patients'],datasets:[{data:[patients.length]}]}
});
}

function initCalendar(){
calendar=new FullCalendar.Calendar(document.getElementById('cal'),{
initialView:'dayGridMonth'
});
calendar.render();
}

function updateCalendar(){
if(!calendar)return;
calendar.removeAllEvents();
patients.forEach(p=>{
calendar.addEvent({title:p.name,start:p.date});
});
}

function updateAll(){
renderPatients();
document.getElementById('count').innerText=patients.length;
updateChart();
updateCalendar();
}

function toggleDark(){document.body.classList.toggle('dark');}

setInterval(updateAll,3000);

</script>
</body>
</html>
