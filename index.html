<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Elite National Hospital System PRO</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
body{font-family:Segoe UI;margin:0;background:#f3f4f6}
.hidden{display:none}
#app{display:grid;grid-template-columns:240px 1fr}
#sidebar{background:#111827;color:white;height:100vh;padding:10px}
#sidebar a{display:block;color:white;padding:10px;text-decoration:none;cursor:pointer}
#sidebar a:hover{background:#374151}
#main{padding:20px}
.card{background:white;padding:20px;margin-bottom:20px;border-radius:10px}
table{width:100%;border-collapse:collapse}
td,th{padding:10px;border-bottom:1px solid #ddd}
img{border-radius:10px}
.dashboard-cards{display:flex;gap:20px;flex-wrap:wrap}
.dashboard-card{flex:1;padding:20px;border-radius:10px;cursor:pointer}
input, select, button{padding:8px;margin:5px 0;width:100%;border-radius:5px;border:1px solid #ccc}
button{background:#1e40af;color:white;border:none;cursor:pointer}
button:hover{background:#2563eb}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login-page" style="display:flex;justify-content:center;align-items:center;height:100vh;background:#1e40af;color:white">
  <div style="background:white;color:black;padding:20px;border-radius:10px;width:300px">
    <h2>Login</h2>
    <form id="login-form">
      <input id="username" placeholder="Username" required>
      <input id="password" type="password" placeholder="Password" required>
      <select id="role">
        <option value="">Role</option>
        <option value="admin">Admin</option>
        <option value="doctor">Doctor</option>
        <option value="nurse">Nurse</option>
        <option value="reception">Reception</option>
      </select>
      <button>Login</button>
    </form>
  </div>
</div>

<!-- APP -->
<div id="app" class="hidden">

  <div id="sidebar">
    <h3>HMS PRO</h3>
    <a onclick="nav('dashboard')">Dashboard</a>
    <a onclick="nav('patients')" class="role-admin role-reception">Patients</a>
    <a onclick="nav('appointments')" class="role-admin role-doctor">Appointments</a>
    <a onclick="nav('pharmacy')" class="role-admin role-reception">Pharmacy</a>
    <a onclick="nav('doctors')" class="role-admin">Doctors</a>
    <a onclick="logout()">Logout</a>
  </div>

  <div id="main">

    <!-- DASHBOARD -->
    <div id="dashboard" class="page">

      <h2>Dashboard</h2>

      <!-- Doctor Images -->
      <div style="display:flex;gap:20px;margin-bottom:20px">
        <div style="text-align:center">
          <img src="https://images.unsplash.com/photo-1607746882042-944635dfe10e" style="width:120px;height:120px;object-fit:cover">
          <p>Dr. James</p>
        </div>

        <div style="text-align:center">
          <img src="https://images.unsplash.com/photo-1594824476967-48c8b964273f" style="width:120px;height:120px;object-fit:cover">
          <p>Dr. Sarah</p>
        </div>
      </div>

      <!-- Clickable Cards -->
      <div class="dashboard-cards">

        <div class="dashboard-card" style="background:#dbeafe" onclick="nav('patients')">
          <h3>Patients</h3>
          <p id="stat-p">0</p>
        </div>

        <div class="dashboard-card" style="background:#dcfce7" onclick="nav('appointments')">
          <h3>Appointments</h3>
          <p id="stat-a">0</p>
        </div>

        <div class="dashboard-card" style="background:#fee2e2" onclick="nav('pharmacy')">
          <h3>Revenue</h3>
          <p>UGX <span id="stat-r">0</span></p>
        </div>

      </div>

    </div>

    <!-- DOCTORS -->
    <div id="doctors" class="page hidden">
      <div class="card">
        <h2>Doctors</h2>
        <form id="doc-form">
          <input id="doc-name" placeholder="Doctor Name">
          <input id="doc-spec" placeholder="Specialty">
          <input type="file" id="doc-img">
          <button>Add</button>
        </form>
        <table><tbody id="doc-table"></tbody></table>
      </div>
    </div>

    <!-- PATIENTS -->
    <div id="patients" class="page hidden">
      <div class="card">
        <h2>Patients</h2>
        <form id="p-form">
          <input id="p-name" placeholder="Name">
          <input id="p-nid" placeholder="NID">
          <button>Add</button>
        </form>
        <table><tbody id="p-table"></tbody></table>
      </div>
    </div>

    <!-- APPOINTMENTS -->
    <div id="appointments" class="page hidden">
      <div class="card">
        <h2>Appointments</h2>
        <form id="a-form">
          <input id="a-patient" placeholder="Patient">
          <input id="a-date" type="date">
          <button>Add</button>
        </form>
        <table><tbody id="a-table"></tbody></table>
      </div>
    </div>

    <!-- PHARMACY -->
    <div id="pharmacy" class="page hidden">
      <div class="card">
        <h2>Pharmacy</h2>

        <form id="drug-form">
          <input id="d-name" placeholder="Drug">
          <input id="d-price" placeholder="Price">
          <input id="d-stock" placeholder="Stock">
          <button>Add</button>
        </form>

        <h3>Dispense Drug</h3>
        <form id="dispense-form">
          <input id="disp-name" placeholder="Drug Name">
          <input id="disp-qty" placeholder="Quantity">
          <button>Dispense</button>
        </form>

        <table>
          <thead><tr><th>Name</th><th>Price</th><th>Stock</th><th>Status</th></tr></thead>
          <tbody id="d-table"></tbody>
        </table>

      </div>
    </div>

  </div>
</div>

<script>
// USERS
const users={
  admin:{p:"admin123",r:"admin"},
  doctor01:{p:"doc2025",r:"doctor"},
  nurse01:{p:"nurse2025",r:"nurse"},
  reception:{p:"rec2025",r:"reception"}
};

// STORAGE HELPERS
const get=k=>JSON.parse(localStorage.getItem(k))||[];
const set=(k,v)=>localStorage.setItem(k,JSON.stringify(v));

// ELEMENTS
const loginForm = document.getElementById("login-form");
const username = document.getElementById("username");
const password = document.getElementById("password");
const role = document.getElementById("role");

const docForm = document.getElementById("doc-form");
const docName = document.getElementById("doc-name");
const docSpec = document.getElementById("doc-spec");
const docImg = document.getElementById("doc-img");
const docTable = document.getElementById("doc-table");

const pForm = document.getElementById("p-form");
const pName = document.getElementById("p-name");
const pNid = document.getElementById("p-nid");
const pTable = document.getElementById("p-table");

const aForm = document.getElementById("a-form");
const aPatient = document.getElementById("a-patient");
const aDate = document.getElementById("a-date");
const aTable = document.getElementById("a-table");

const drugForm = document.getElementById("drug-form");
const dName = document.getElementById("d-name");
const dPrice = document.getElementById("d-price");
const dStock = document.getElementById("d-stock");

const dispenseForm = document.getElementById("dispense-form");
const dispName = document.getElementById("disp-name");
const dispQty = document.getElementById("disp-qty");

const statP = document.getElementById("stat-p");
const statA = document.getElementById("stat-a");
const statR = document.getElementById("stat-r");

// LOGIN
loginForm.onsubmit = e=>{
  e.preventDefault();
  const u=username.value.toLowerCase();
  const p=password.value;
  const r=role.value;

  if(users[u] && users[u].p===p && users[u].r===r){
    document.getElementById("login-page").style.display="none";
    document.getElementById("app").classList.remove("hidden");

    document.querySelectorAll('[class*="role-"]').forEach(x=>x.style.display="none");
    document.querySelectorAll('.role-'+r).forEach(x=>x.style.display="block");

    load();
  }else alert("Wrong login");
};

// NAVIGATION
function nav(id){
  document.querySelectorAll('.page').forEach(p=>p.classList.add('hidden'));
  document.getElementById(id).classList.remove('hidden');
}

// DASHBOARD UPDATE
function updateDashboard(){
  statP.innerText = get('patients').length;
  statA.innerText = get('appointments').length;

  let rev=0;
  get('drugs').forEach(d=>rev += Number(d.price)*Number(d.stock));
  statR.innerText = rev.toLocaleString();
}

// DOCTORS
docForm.onsubmit = e=>{
  e.preventDefault();
  let reader = new FileReader();
  reader.onload = ()=>{
    let docs = get('doctors');
    docs.push({name:docName.value,spec:docSpec.value,img:reader.result});
    set('doctors',docs);
    load();
  };
  if(docImg.files[0]) reader.readAsDataURL(docImg.files[0]);
};

// PATIENTS
pForm.onsubmit = e=>{
  e.preventDefault();
  let patients = get('patients');
  patients.push({name:pName.value,nid:pNid.value});
  set('patients',patients);
  load();
};

// APPOINTMENTS
aForm.onsubmit = e=>{
  e.preventDefault();
  let appointments = get('appointments');
  appointments.push({p:aPatient.value,date:aDate.value});
  set('appointments',appointments);
  load();
};

// DRUGS
drugForm.onsubmit = e=>{
  e.preventDefault();
  let drugs = get('drugs');
  drugs.push({name:dName.value,price:dPrice.value,stock:dStock.value});
  set('drugs',drugs);
  load();
};

// DISPENSE
dispenseForm.onsubmit = e=>{
  e.preventDefault();
  let drugs = get('drugs');
  drugs.forEach(x=>{
    if(x.name === dispName.value){
      x.stock = Number(x.stock)-Number(dispQty.value);
    }
  });
  set('drugs',drugs);
  load();
};

// LOAD DATA
function load(){
  // DOCTORS
  let docs = get('doctors');
  docTable.innerHTML="";
  docs.forEach(x=>{
    docTable.innerHTML+=`<tr>
      <td><img src="${x.img}" width="40"></td>
      <td>${x.name}</td>
      <td>${x.spec}</td>
    </tr>`;
  });

  // PATIENTS
  let patients = get('patients');
  pTable.innerHTML="";
  patients.forEach(x=>{
    pTable.innerHTML+=`<tr><td>${x.name}</td><td>${x.nid}</td></tr>`;
  });

  // APPOINTMENTS
  let appointments = get('appointments');
  aTable.innerHTML="";
  appointments.forEach(x=>{
    aTable.innerHTML+=`<tr><td>${x.p}</td><td>${x.date}</td></tr>`;
  });

  // DRUGS
  let drugs = get('drugs');
  const dTable = document.getElementById("d-table");
  dTable.innerHTML="";
  drugs.forEach(x=>{
    let s = Number(x.stock);
    let status="GOOD", emoji="🟢";
    if(s < 10){status="CRITICAL"; emoji="🔴";}
    else if(s < 50){status="LOW"; emoji="🟡";}
    else if(s > 200){status="HIGH"; emoji="🟢";}
    dTable.innerHTML+=`<tr>
      <td>${x.name}</td>
      <td>${x.price}</td>
      <td>${s}</td>
      <td>${emoji} ${status}</td>
    </tr>`;
  });

  updateDashboard();
}

// LOGOUT
function logout(){ location.reload(); }

// INIT LOCAL STORAGE
if(!localStorage.getItem('patients')){
  set('patients',[]);
  set('appointments',[]);
  set('drugs',[{name:"Panadol",price:1500,stock:20}]);
  set('doctors',[]);
}

</script>

</body>
</html>
