<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Elite National Hospital System PRO</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
body{font-family:Segoe UI;margin:0;background:#f3f4f6}
.hidden{display:none}
#app{display:grid;grid-template-columns:240px 1fr}
#sidebar{background:#111827;color:white;height:100vh;padding:10px}
#sidebar a{display:block;color:white;padding:10px;text-decoration:none}
#sidebar a:hover{background:#374151}
#main{padding:20px}
.card{background:white;padding:20px;margin-bottom:20px;border-radius:10px}
table{width:100%;border-collapse:collapse}
td,th{padding:10px;border-bottom:1px solid #ddd}
img{border-radius:50%;width:40px;height:40px}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="login-page" style="display:flex;justify-content:center;align-items:center;height:100vh;background:#1e40af;color:white">
<div style="background:white;color:black;padding:20px;border-radius:10px;width:300px">
<h2>Login</h2>
<form id="login-form">
<input id="username" placeholder="Username" required>
<input id="password" type="password" placeholder="Password" required>
<select id="role">
<option value="">Role</option>
<option value="admin">Admin</option>
<option value="doctor">Doctor</option>
<option value="nurse">Nurse</option>
<option value="reception">Reception</option>
</select>
<button>Login</button>
</form>
</div>
</div>

<!-- APP -->
<div id="app" class="hidden">

<div id="sidebar">
<h3>HMS PRO</h3>
<a onclick="nav('dashboard')">Dashboard</a>
<a onclick="nav('patients')" class="role-admin role-reception">Patients</a>
<a onclick="nav('appointments')" class="role-admin role-doctor">Appointments</a>
<a onclick="nav('pharmacy')" class="role-admin role-reception">Pharmacy</a>
<a onclick="nav('doctors')" class="role-admin">Doctors</a>
<a onclick="logout()">Logout</a>
</div>

<div id="main">

<!-- DASHBOARD -->
<div id="dashboard" class="page">
<div class="card">
<h2>Dashboard</h2>
<p>Patients: <span id="stat-p">0</span></p>
<p>Appointments: <span id="stat-a">0</span></p>
<p>Revenue: UGX <span id="stat-r">0</span></p>
</div>
</div>

<!-- DOCTORS -->
<div id="doctors" class="page hidden">
<div class="card">
<h2>Doctors</h2>
<form id="doc-form">
<input id="doc-name" placeholder="Doctor Name">
<input id="doc-spec" placeholder="Specialty">
<input type="file" id="doc-img">
<button>Add</button>
</form>
<table><tbody id="doc-table"></tbody></table>
</div>
</div>

<!-- PATIENTS -->
<div id="patients" class="page hidden">
<div class="card">
<h2>Patients</h2>
<form id="p-form">
<input id="p-name" placeholder="Name">
<input id="p-nid" placeholder="NID">
<button>Add</button>
</form>
<table><tbody id="p-table"></tbody></table>
</div>
</div>

<!-- APPOINTMENTS -->
<div id="appointments" class="page hidden">
<div class="card">
<h2>Appointments</h2>
<form id="a-form">
<input id="a-patient" placeholder="Patient">
<input id="a-date" type="date">
<button>Add</button>
</form>
<table><tbody id="a-table"></tbody></table>
</div>
</div>

<!-- PHARMACY -->
<div id="pharmacy" class="page hidden">
<div class="card">
<h2>Pharmacy</h2>

<form id="drug-form">
<input id="d-name" placeholder="Drug">
<input id="d-price" placeholder="Price">
<input id="d-stock" placeholder="Stock">
<button>Add</button>
</form>

<h3>Dispense Drug</h3>
<form id="dispense-form">
<input id="disp-name" placeholder="Drug Name">
<input id="disp-qty" placeholder="Quantity">
<button>Dispense</button>
</form>

<table>
<thead><tr><th>Name</th><th>Price</th><th>Stock</th><th>Status</th></tr></thead>
<tbody id="d-table"></tbody>
</table>

</div>
</div>

</div>
</div>

<script>

// USERS
const users={
admin:{p:"admin123",r:"admin"},
doctor01:{p:"doc2025",r:"doctor"},
nurse01:{p:"nurse2025",r:"nurse"},
reception:{p:"rec2025",r:"reception"}
};

// STORAGE
const get=k=>JSON.parse(localStorage.getItem(k))||[];
const set=(k,v)=>localStorage.setItem(k,JSON.stringify(v));

// LOGIN
login-form.onsubmit=e=>{
e.preventDefault();
let u=username.value.toLowerCase();
let p=password.value;
let r=role.value;

if(users[u] && users[u].p===p && users[u].r===r){
login-page.style.display="none";
app.classList.remove("hidden");

document.querySelectorAll('[class*="role-"]').forEach(x=>x.style.display="none");
document.querySelectorAll('.role-'+r).forEach(x=>x.style.display="block");

load();
}else alert("Wrong login");
};

// NAV
function nav(id){
document.querySelectorAll('.page').forEach(p=>p.classList.add('hidden'));
document.getElementById(id).classList.remove('hidden');
}

// DASHBOARD
function update(){
stat-p.innerText=get('patients').length;
stat-a.innerText=get('appointments').length;

let rev=0;
get('drugs').forEach(d=>rev+=Number(d.price)*2);
stat-r.innerText=rev.toLocaleString();
}

// DOCTORS
doc-form.onsubmit=e=>{
e.preventDefault();

let reader=new FileReader();
reader.onload=()=>{
let d=get('doctors');
d.push({
name:doc-name.value,
spec:doc-spec.value,
img:reader.result
});
set('doctors',d);
load();
};
reader.readAsDataURL(doc-img.files[0]);
};

function loadDocs(){
let d=get('doctors');
doc-table.innerHTML="";
d.forEach(x=>{
doc-table.innerHTML+=`
<tr>
<td><img src="${x.img}"></td>
<td>${x.name}</td>
<td>${x.spec}</td>
</tr>`;
});
}

// PATIENTS
p-form.onsubmit=e=>{
e.preventDefault();
let d=get('patients');
d.push({name:p-name.value,nid:p-nid.value});
set('patients',d);
load();
};

// APPOINTMENTS
a-form.onsubmit=e=>{
e.preventDefault();
let d=get('appointments');
d.push({p:a-patient.value,date:a-date.value});
set('appointments',d);
load();
};

// DRUGS
drug-form.onsubmit=e=>{
e.preventDefault();
let d=get('drugs');
d.push({name:d-name.value,price:d-price.value,stock:d-stock.value});
set('drugs',d);
load();
};

// DISPENSE
dispense-form.onsubmit=e=>{
e.preventDefault();
let d=get('drugs');
d.forEach(x=>{
if(x.name===disp-name.value){
x.stock=Number(x.stock)-Number(disp-qty.value);
}
});
set('drugs',d);
load();
};

// LOAD
function load(){
loadDocs();

let p=get('patients');
p-table.innerHTML="";
p.forEach(x=>{
p-table.innerHTML+=`<tr><td>${x.name}</td><td>${x.nid}</td></tr>`;
});

let a=get('appointments');
a-table.innerHTML="";
a.forEach(x=>{
a-table.innerHTML+=`<tr><td>${x.p}</td><td>${x.date}</td></tr>`;
});

let d=get('drugs');
d-table.innerHTML="";
d.forEach(x=>{
let s=Number(x.stock);
let status="GOOD";
if(s<10) status="CRITICAL";
else if(s<50) status="LOW";
else if(s>200) status="HIGH";

d-table.innerHTML+=`
<tr>
<td>${x.name}</td>
<td>${x.price}</td>
<td>${s}</td>
<td>${status}</td>
</tr>`;
});

update();
}

// LOGOUT
function logout(){location.reload();}

// INIT
if(!localStorage.getItem('patients')){
set('patients',[]);
set('appointments',[]);
set('drugs',[{name:"Panadol",price:1500,stock:20}]);
set('doctors',[]);
}

</script>

</body>
</html>
